<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RepoGuard Reports</title>
  <style>
    :root {
      --bg: #05070b;
      --panel: #0d1117;
      --panel-2: #111722;
      --ink: #f4f7fb;
      --muted: #8b98a8;
      --line: #222b38;
      --line-2: #303b4c;
      --blue: #8ecbff;
      --green: #57e39b;
      --amber: #ffd166;
      --red: #ff6b6b;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -20%, rgba(142, 203, 255, .12), transparent 32%),
        linear-gradient(180deg, #05070b 0%, #080d14 100%);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button {
      font: inherit;
      letter-spacing: 0;
    }

    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 46px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      font-weight: 780;
      font-size: 18px;
      text-decoration: none;
    }

    .brand svg {
      width: 30px;
      height: 34px;
      flex: 0 0 auto;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-link,
    .button {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 12px;
      color: var(--ink);
      background: rgba(244, 247, 251, .04);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }

    .button {
      border-radius: 10px;
      background: #151b25;
    }

    .hero {
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .hero p {
      margin: 14px 0 0;
      color: var(--muted);
      max-width: 720px;
      font-size: 15px;
      line-height: 1.65;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, .75fr) minmax(0, 1.25fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(13, 17, 23, .94);
      box-shadow: 0 26px 90px rgba(0, 0, 0, .38);
      overflow: hidden;
    }

    .panel-head {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }

    .title {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 900;
    }

    .panel-body {
      padding: 14px;
    }

    .report-list {
      display: grid;
      gap: 10px;
      max-height: 660px;
      overflow: auto;
    }

    .report-item {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0b1018;
      color: var(--ink);
      padding: 11px;
      text-align: left;
      cursor: pointer;
    }

    .report-item.active {
      border-color: rgba(142, 203, 255, .7);
      box-shadow: 0 0 0 2px rgba(142, 203, 255, .12);
    }

    .row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .repo {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .meta {
      margin-top: 7px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .risk-pill {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 4px 8px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      border: 1px solid rgba(87, 227, 155, .42);
      color: var(--green);
      background: rgba(87, 227, 155, .08);
    }

    .risk-pill.low {
      color: var(--blue);
      border-color: rgba(142, 203, 255, .42);
      background: rgba(142, 203, 255, .08);
    }

    .risk-pill.medium {
      color: var(--amber);
      border-color: rgba(255, 209, 102, .42);
      background: rgba(255, 209, 102, .08);
    }

    .risk-pill.high,
    .risk-pill.critical {
      color: var(--red);
      border-color: rgba(255, 107, 107, .42);
      background: rgba(255, 107, 107, .08);
    }

    .summary {
      margin: 0;
      color: #d7e2ee;
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #080c12;
      padding: 11px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 7px;
      font-family: var(--mono);
      font-size: 20px;
    }

    .findings {
      display: grid;
      gap: 10px;
      max-height: 420px;
      overflow: auto;
      margin-top: 10px;
    }

    .finding,
    .empty {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0b1018;
      padding: 11px;
    }

    .empty {
      color: var(--muted);
      border-style: dashed;
      font-family: var(--mono);
      font-size: 12px;
    }

    .finding-title {
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .finding p {
      margin: 8px 0 0;
      color: #c9d3df;
      line-height: 1.5;
      font-size: 13px;
    }

    .markdown {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #05070b;
      color: #d7e2ee;
      padding: 12px;
      max-height: 280px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
    }

    @media (max-width: 860px) {
      .layout,
      .stats {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="/">
        <svg viewBox="0 0 48 54" role="img" aria-label="RepoGuard shield logo">
          <defs>
            <linearGradient id="shieldGradient" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#8ecbff" />
            </linearGradient>
          </defs>
          <path d="M24 3 42 10v15c0 13-7.7 21.7-18 26C13.7 46.7 6 38 6 25V10L24 3Z" fill="url(#shieldGradient)" />
          <path d="M18 27.5 22.2 32 31 21" fill="none" stroke="#05070b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>RepoGuard</span>
      </a>
      <div class="top-actions">
        <a class="nav-link" href="/">Scan</a>
        <button class="button" id="refreshBtn" type="button">Refresh</button>
      </div>
    </header>

    <section class="hero">
      <h1>Reports</h1>
      <p>Browse previous RepoGuard scans, compare risk levels, and inspect the findings that were saved to Markdown and JSON.</p>
    </section>

    <main class="layout">
      <section class="panel">
        <div class="panel-head">
          <div class="title">report.history</div>
          <span class="meta" id="reportCount">0 reports</span>
        </div>
        <div class="panel-body">
          <div class="report-list" id="reportList">
            <div class="empty">Loading reports...</div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div class="title">report.detail</div>
          <span class="meta" id="selectedPath">no report selected</span>
        </div>
        <div class="panel-body" id="reportDetail">
          <div class="empty">Select a report to inspect its summary, budget, and findings.</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let activePath = '';

    async function request(path) {
      const res = await fetch(path);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function loadReports() {
      $('reportList').innerHTML = '<div class="empty">Loading reports...</div>';
      try {
        const data = await request('/api/reports');
        renderReports(data.reports || []);
      } catch (error) {
        $('reportList').innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    function renderReports(reports) {
      $('reportCount').textContent = `${reports.length} report${reports.length === 1 ? '' : 's'}`;
      const list = $('reportList');
      list.innerHTML = '';
      if (!reports.length) {
        list.innerHTML = '<div class="empty">No reports yet. Run a scan first.</div>';
        return;
      }
      reports.forEach((report) => {
        const button = document.createElement('button');
        button.className = `report-item ${report.path === activePath ? 'active' : ''}`;
        button.type = 'button';
        button.innerHTML = `
          <div class="row">
            <div class="repo">${escapeHtml(report.repo)}</div>
            <span class="${riskClass(report.risk_level)}">${escapeHtml(report.risk_level)}</span>
          </div>
          <div class="meta">
            ${escapeHtml(report.findings_count)} finding${report.findings_count === 1 ? '' : 's'} · ${escapeHtml(report.status)}<br />
            ${escapeHtml(formatDate(report.finished_at || report.started_at))}<br />
            ${escapeHtml(report.path)}
          </div>
        `;
        button.addEventListener('click', () => loadReport(report.path));
        list.appendChild(button);
      });
    }

    async function loadReport(path) {
      activePath = path;
      $('selectedPath').textContent = path;
      $('reportDetail').innerHTML = '<div class="empty">Loading report...</div>';
      try {
        const data = await request(`/api/report?path=${encodeURIComponent(path)}`);
        renderReportDetail(data.report, data.markdown || '');
        document.querySelectorAll('.report-item').forEach((item) => item.classList.remove('active'));
        const match = Array.from(document.querySelectorAll('.report-item')).find((item) => item.textContent.includes(path));
        if (match) match.classList.add('active');
      } catch (error) {
        $('reportDetail').innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    function renderReportDetail(report, markdown) {
      const findings = report.findings || [];
      const budget = report.budget || {};
      $('reportDetail').innerHTML = `
        <p class="summary">${escapeHtml(report.summary || 'No summary available.')}</p>
        <div class="stats">
          <div class="stat"><span>risk</span><strong>${escapeHtml(report.risk_level || '-')}</strong></div>
          <div class="stat"><span>findings</span><strong>${findings.length}</strong></div>
          <div class="stat"><span>context tokens</span><strong>${escapeHtml(budget.used_tokens ?? 0)}</strong></div>
        </div>
        <div class="title">findings</div>
        <div class="findings">
          ${findings.length ? findings.map(renderFinding).join('') : '<div class="empty">No findings in this report.</div>'}
        </div>
        <div class="title" style="margin-top:14px;">markdown</div>
        <div class="markdown">${escapeHtml(markdown || 'No Markdown report found.')}</div>
      `;
    }

    function renderFinding(finding) {
      return `
        <div class="finding">
          <div class="row">
            <div class="finding-title">${escapeHtml(finding.title)}</div>
            <span class="${riskClass(finding.severity)}">${escapeHtml(finding.severity)}</span>
          </div>
          <div class="meta">${escapeHtml(finding.scanner)} · ${escapeHtml(finding.file || 'unknown')}${finding.line ? ':' + finding.line : ''}</div>
          <p>${escapeHtml(finding.description || '')}</p>
          <p><strong>Recommendation:</strong> ${escapeHtml(finding.recommendation || 'Review before running this repository.')}</p>
        </div>
      `;
    }

    function riskClass(risk) {
      return `risk-pill ${String(risk || 'info').toLowerCase()}`;
    }

    function formatDate(value) {
      if (!value) return 'unknown time';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    $('refreshBtn').addEventListener('click', loadReports);
    loadReports();
  </script>
</body>
</html>
